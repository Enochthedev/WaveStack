name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Type checking ────────────────────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/core-app exec prisma generate

      - name: Typecheck core-app
        run: pnpm -C apps/core-app typecheck

      - name: Typecheck web
        run: pnpm -C apps/web typecheck

  # ── Linting ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/core-app exec prisma generate

      - name: Lint core-app
        run: pnpm -C apps/core-app lint

      - name: Lint web
        run: pnpm -C apps/web lint

  # ── Tests ────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: wavestack
          POSTGRES_PASSWORD: wavestack
          POSTGRES_DB: wavestack_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://wavestack:wavestack@localhost:5432/wavestack_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      AUTH_MODE: none
      PORT: 3001

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm -C apps/core-app exec prisma generate

      - name: Run migrations
        run: pnpm -C apps/core-app exec prisma migrate deploy

      - name: Run tests
        run: pnpm -C apps/core-app test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/core-app/coverage/
          retention-days: 7

  # ── Kubernetes manifests ─────────────────────────────────────────────────────
  k8s-manifests:
    name: Validate k8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/

      - name: Render and validate every overlay
        run: |
          for target in infra/k8s/base infra/k8s/overlays/dev infra/k8s/overlays/prod; do
            echo "::group::$target"
            kubectl kustomize "$target" | kubeconform -strict -summary -
            echo "::endgroup::"
          done
