version: "3.8"

services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: wave
      POSTGRES_DB: wave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ChromaDB for vector embeddings
  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  # Ollama — only useful with a GPU. Excluded from Railway deploys.
  # To run locally: docker compose --profile ai up
  # ollama:
  #   image: ollama/ollama:latest
  #   profiles: ["ai"]
  #   ports: ["11434:11434"]
  #   volumes: [ollama_data:/root/.ollama]
  #   restart: unless-stopped

  # Publisher — unified social publishing (Python/FastAPI)
  publisher:
    build:
      context: ./services/publisher
      dockerfile: Dockerfile
    ports:
      - "8600:8600"
    environment:
      - DATABASE_URL=postgresql://postgres:wave@postgres:5432/wave
      - REDIS_URL=redis://redis:6379
      # Social platforms
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME}
      - INSTAGRAM_PASSWORD=${INSTAGRAM_PASSWORD}
      - TIKTOK_SESSION_ID=${TIKTOK_SESSION_ID}
      - FACEBOOK_ACCESS_TOKEN=${FACEBOOK_ACCESS_TOKEN}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN}
      # Twitter/X
      - TWITTER_API_KEY=${TWITTER_API_KEY}
      - TWITTER_API_SECRET=${TWITTER_API_SECRET}
      - TWITTER_ACCESS_TOKEN=${TWITTER_ACCESS_TOKEN}
      - TWITTER_ACCESS_SECRET=${TWITTER_ACCESS_SECRET}
      - TWITTER_BEARER_TOKEN=${TWITTER_BEARER_TOKEN}
      # YouTube
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      # AI integration
      - AI_PERSONALITY_URL=http://ai-core:8200
      - THUMBNAIL_GENERATOR_URL=http://clipper:8000
      - USE_AI_CAPTIONS=true
      - USE_AI_HASHTAGS=true
    volumes:
      - ./services/publisher:/app
      - social_sessions:/app/sessions
      - social_uploads:/app/uploads
      - youtube_credentials:/app/credentials
      - youtube_uploads:/app/youtube-uploads
    depends_on:
      - redis
      - ai-core
    restart: unless-stopped

  # Core App (Fastify/TypeScript)
  core-app:
    build:
      context: ./apps/core-app
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:wave@postgres:5432/wave
      - REDIS_URL=redis://redis:6379
      - AUTH_KEYS_DIR=/app/keys
    volumes:
      - ./apps/core-app:/app
      - core_app_keys:/app/keys
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  # Clipper Service — clip + thumbnail generation (Python/FastAPI)
  clipper:
    build:
      context: ./services/clipper
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379
      - WAVESTACK_API_URL=http://core-app:3000
      - AI_PERSONALITY_URL=http://ai-core:8200
      - IMAGE_PROVIDER=${THUMBNAIL_IMAGE_PROVIDER:-local}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - USE_AI_PROMPTS=true
    volumes:
      - ./services/clipper:/app
      - clipper_cache:/tmp/clips
      - thumbnail_data:/app/thumbnails
      - thumbnail_models:/app/models
    depends_on:
      - redis
      - core-app
      - ai-core
    restart: unless-stopped

  # AI Core — unified AI service: personality + knowledge + models + agents (Python/FastAPI)
  ai-core:
    build:
      context: ./services/ai-core
      dockerfile: Dockerfile
    ports:
      - "8200:8200"
    environment:
      - DATABASE_URL=postgresql://postgres:wave@postgres:5432/wave
      - REDIS_URL=redis://redis:6379
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # LLM providers
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TOGETHER_API_KEY=${TOGETHER_API_KEY}
      - OLLAMA_BASE_URL=${OLLAMA_INTERNAL_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
      # Personality
      - PERSONALITY_TEMPERATURE=0.8
      - PERSONALITY_MAX_TOKENS=500
      - SENTIMENT_FILTERING=true
      - CONTROVERSY_AVOIDANCE=true
      # Agent orchestration
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-secret}
      - APPROVAL_TIMEOUT_HOURS=4
    volumes:
      - ./services/ai-core:/app
    depends_on:
      - postgres
      - redis
      - chromadb
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8200/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Community Bot — Discord + Twitch + Telegram (TypeScript)
  community-bot:
    build:
      context: ./services/community-bot
      dockerfile: Dockerfile
    environment:
      # Discord
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      # Twitch
      - TWITCH_BOT_USERNAME=${TWITCH_BOT_USERNAME}
      - TWITCH_OAUTH_TOKEN=${TWITCH_OAUTH_TOKEN}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      # Telegram
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      # Shared
      - DATABASE_URL=postgresql://postgres:wave@postgres:5432/wave
      - REDIS_URL=redis://redis:6379
      - WAVESTACK_API_URL=http://core-app:3000
      - AI_PERSONALITY_URL=http://ai-core:8200
      # Moderation (auto-mod logic now lives in ai-core)
      - USE_AI_MODERATION=${USE_AI_MODERATION:-true}
      - AUTO_MOD_URL=http://ai-core:8200
      - TOXICITY_THRESHOLD=${TOXICITY_THRESHOLD:-0.7}
      - SPAM_THRESHOLD=${SPAM_THRESHOLD:-0.6}
    volumes:
      - ./services/community-bot:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
      - core-app
      - ai-core
    restart: unless-stopped

  # n8n for workflow automation
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - ai-core
      - core-app
    restart: unless-stopped

  # Analytics — metrics + streaming + hype detection (Go)
  analytics:
    build:
      context: ./services/analytics
      dockerfile: Dockerfile
    ports:
      - "8800:8800"
    environment:
      - PORT=8800
      - REDIS_URL=redis://redis:6379
      - METRICS_RETENTION_DAYS=${METRICS_RETENTION_DAYS:-90}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-300}
      # Streaming / hype detection
      - CORE_API_URL=http://core-app:3000
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-secret}
      - MEDIAMTX_URL=rtmp://mediamtx:1935/live
      # Platform APIs
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    depends_on:
      - redis
      - mediamtx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8800/health > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Sponsor/Ad Manager (TypeScript/Fastify)
  sponsor-manager:
    build:
      context: ./services/sponsor-manager
      dockerfile: Dockerfile
    ports:
      - "8900:8900"
    environment:
      - PORT=8900
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:wave@postgres:5432/wave
      - STRIPE_API_KEY=${STRIPE_API_KEY}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # ── Notifications :4000 ───────────────────────────────────────────────────────
  notifications:
    build:
      context: ./services/notifications
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - REDIS_URL=redis://redis:6379
      - EXPO_ACCESS_TOKEN=${EXPO_ACCESS_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - INTERNAL_SERVICE_SECRET=${INTERNAL_SERVICE_SECRET:-dev-internal-secret}
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Cloud RTMP Ingest :1935 (MediaMTX) ────────────────────────────────────────
  # Receives RTMP from consoles (PS5, Xbox) or OBS. Analytics service reads from
  # here and rebroadcasts via FFmpeg to Twitch/YouTube/Kick/etc.
  mediamtx:
    image: bluenviron/mediamtx:1.11.3-ffmpeg
    ports:
      - "1935:1935" # RTMP ingest
      - "9997:9997" # API
      - "8554:8554" # RTSP (optional, for monitoring)
    environment:
      - MTX_RTMP=yes
      - MTX_RTMPADDRESS=:1935
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_LOGLEVEL=warn
      - MTX_PROTOCOLS=tcp
    restart: unless-stopped
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:9997/v3/paths/list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  thumbnail_data:
  thumbnail_models:
  youtube_credentials:
  youtube_uploads:
  social_sessions:
  social_uploads:
  core_app_keys:
  clipper_cache:
  n8n_data:
