# ── Twitch Bot ────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: twitch-bot
  namespace: wavestack
  labels:
    app: twitch-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: twitch-bot
  template:
    metadata:
      labels:
        app: twitch-bot
    spec:
      containers:
        - name: twitch-bot
          image: wavestack/twitch-bot:latest
          envFrom:
            - configMapRef:
                name: wavestack-config
            - secretRef:
                name: wavestack-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
