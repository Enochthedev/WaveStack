apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-orchestrator
  namespace: wavestack
  labels:
    app: agent-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent-orchestrator
  template:
    metadata:
      labels:
        app: agent-orchestrator
    spec:
      containers:
        - name: agent-orchestrator
          image: wavestack/agent-orchestrator:latest
          ports:
            - containerPort: 3300
          envFrom:
            - configMapRef:
                name: wavestack-config
            - secretRef:
                name: wavestack-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3300
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3300
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: agent-orchestrator
  namespace: wavestack
spec:
  selector:
    app: agent-orchestrator
  ports:
    - port: 3300
      targetPort: 3300
