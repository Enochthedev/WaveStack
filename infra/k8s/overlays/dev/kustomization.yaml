apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wavestack-dev

resources:
  - ../../base

patches:
  # Single replica for all deployments in dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  # Scale down StatefulSets too
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet

configMapGenerator:
  - name: wavestack-config
    behavior: merge
    literals:
      - NODE_ENV=development
      - LOG_LEVEL=debug
