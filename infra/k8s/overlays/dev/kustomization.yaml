apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wavestack-dev

resources:
  - ../../base

patches:
  # Single replica for all deployments in dev
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment

  # Scale down StatefulSets too
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet

  # The base ships wavestack-config as a plain resource, so configMapGenerator
  # cannot merge into it (that only works for generated ConfigMaps).
  - path: configmap-patch.yaml
    target:
      kind: ConfigMap
      name: wavestack-config
