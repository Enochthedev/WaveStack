apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: wavestack

resources:
  - ../../base

patches:
  # Production replica counts
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: core-app

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: web

  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: auto-mod

  # Add cert-manager annotation for TLS in prod
  - patch: |-
      - op: add
        path: /metadata/annotations/cert-manager.io~1cluster-issuer
        value: letsencrypt-prod
    target:
      kind: Ingress
      name: wavestack-ingress

configMapGenerator:
  - name: wavestack-config
    behavior: merge
    literals:
      - NODE_ENV=production
      - LOG_LEVEL=info
